<!DOCTYPE html>
<html>
<head><title>Document Cover - Capturing the full electricity efficiency potential of the U.K.</title></head>
<body class="brand-slide" data-slide-type="structural" data-layout="hero-cover">

  <!-- Title zone: cover title -->
  <div class="title-zone" style="background: var(--brand-primary); padding: 50pt 36pt 0 36pt;">
    <h1 style="margin: 0; font-size: 22px; font-weight: normal; font-style: italic; color: var(--brand-text-inverse); font-family: var(--brand-font-heading); line-height: 1.4;">Capturing the full electricity efficiency potential of the U.K.</h1>
  </div>

  <!-- Content zone -->
  <div class="content-zone" style="padding: 0; position: relative; background: var(--brand-primary);">

    <!-- Container Box (border blends with navy cover background) -->
    <div style="border: 1.5px solid var(--brand-primary); display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative;">
      <!-- Header bar (minimal, blends with navy background) -->
      <div style="background: var(--brand-primary); padding: 2pt 36pt; border-bottom: none;">
        <p style="margin: 0; font-size: 11px; font-weight: bold; color: var(--brand-text-inverse); opacity: 0.4;">Cover</p>
      </div>
      <!-- Body with date positioned at bottom -->
      <div style="padding: 0 36pt 36pt 36pt; display: flex; flex-direction: column; justify-content: flex-end; min-height: 230pt;">
        <p style="margin: 0; font-size: 11px; font-weight: bold; color: var(--brand-text-inverse); text-transform: uppercase; letter-spacing: 1.5px;">November 2012</p>
      </div>
    </div>

    <!-- Diagonal stripes SVG overlay in bottom-right corner -->
    <svg width="100%" viewBox="0 0 720 330" preserveAspectRatio="xMaxYMax meet" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
      <!-- Thin white line separator between navy and gray stripes -->
      <polygon points="545,330 558,330 720,85 720,65" fill="#FFFFFF" opacity="0.15"/>
      <!-- Medium gray band (dark gray) -->
      <polygon points="560,330 618,330 720,140 720,90" fill="#666666"/>
      <!-- Light gray/silver band -->
      <polygon points="621,330 720,330 720,145" fill="#C0C5C9"/>
    </svg>

  </div>

  <!-- Footer zone (hidden for cover slide) -->
  <div class="footer-zone" style="background: var(--brand-primary);">
    <p class="source" style="margin: 0; font-size: 9px; color: var(--brand-primary);">SOURCE: Nexus analysis</p>
    <p class="page-num" style="margin: 0; font-size: 9px; color: var(--brand-primary);">Nexus | 0</p>
  </div>

</body>
<!-- MULTI-SLIDE REMINDER: If creating 3+ slides, you MUST use the Task tool to spawn sub-agents (one per slide, all in ONE message). Do NOT write all slides yourself. See SKILL.md → Multi-Slide Presentations. -->
</html>
