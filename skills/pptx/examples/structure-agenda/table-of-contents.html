<!DOCTYPE html>
<html>
<head><title>Agenda</title></head>
<body class="brand-slide" data-slide-type="structural" data-layout="numbered-items">
  <div class="title-zone">
    <h1 style="margin: 0; font-size: 20px; font-weight: bold; color: var(--brand-primary); font-family: var(--brand-font-heading);">Agenda</h1>
  </div>
  <div class="content-zone">
    <!-- Single Container Box for all agenda items -->
    <div style="border: 1.5px solid var(--brand-surface-light); position: relative; overflow: hidden; display: flex; flex-direction: column; flex: 1;">
      <!-- Header bar -->
      <div style="background: var(--brand-surface-light); padding: 8pt 14pt;">
        <p style="margin: 0; font-size: 12px; font-weight: bold; color: var(--brand-primary);">Table of contents</p>
      </div>
      <!-- Body with agenda items -->
      <div style="flex: 1; padding: 20pt 30pt; display: flex; flex-direction: column; justify-content: space-between;">

        <!-- Agenda Item 1 (Active): dark navy bg with left accent bar and white bold text -->
        <div style="display: flex; align-items: stretch; width: 68%; gap: 0pt;">
          <div style="width: 5pt; background: var(--brand-secondary); flex-shrink: 0;"></div>
          <div style="flex: 1; background: var(--brand-primary); padding: 16pt 20pt; display: flex; align-items: center;">
            <p style="margin: 0; font-size: 12px; font-weight: bold; color: white; line-height: 1.4;">Motor, Pension and Health as key growth drivers in short-mid term in Poland</p>
          </div>
        </div>

        <!-- Agenda Item 2 (Inactive): light gray bg with dark text -->
        <div style="display: flex; align-items: stretch; width: 68%;">
          <div style="flex: 1; background: var(--brand-surface-muted); padding: 16pt 20pt; display: flex; align-items: center;">
            <p style="margin: 0; font-size: 11px; color: var(--brand-gray-dark); line-height: 1.4;">New global emerging trends are driving growth in the insurance industry</p>
          </div>
        </div>

        <!-- Agenda Item 3 (Inactive): light gray bg with dark text -->
        <div style="display: flex; align-items: stretch; width: 68%;">
          <div style="flex: 1; background: var(--brand-surface-muted); padding: 16pt 20pt; display: flex; align-items: center;">
            <p style="margin: 0; font-size: 11px; color: var(--brand-gray-dark); line-height: 1.4;">Regulatory changes have fostered market growth in Turkey (case example)</p>
          </div>
        </div>

        <!-- Agenda Item 4 (Inactive): light gray bg with dark text -->
        <div style="display: flex; align-items: stretch; width: 68%;">
          <div style="flex: 1; background: var(--brand-surface-muted); padding: 16pt 20pt; display: flex; align-items: center;">
            <p style="margin: 0; font-size: 11px; color: var(--brand-gray-dark); line-height: 1.4;">Discussion points</p>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div class="footer-zone">
    <p class="source"></p>
    <p class="page-num">Nexus | 1</p>
  </div>
</body>
