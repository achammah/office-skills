<!DOCTYPE html>
<html>
<head><title>Agenda</title></head>
<body class="brand-slide" data-slide-type="structural" data-layout="numbered-items">
  <div class="title-zone">
    <h1 style="margin: 0; font-size: 20px; font-weight: bold; color: var(--brand-primary); font-family: var(--brand-font-heading);">Agenda</h1>
  </div>

  <div class="content-zone">

    <!-- Container Box wrapping the agenda items -->
    <div style="border: 1.5px solid var(--brand-surface-light); display: flex; flex-direction: column; overflow: hidden; flex: 1;">
      <!-- Header bar -->
      <div style="background: var(--brand-surface-light); padding: 8pt 14pt;">
        <p style="margin: 0; font-size: 14px; font-weight: bold; color: var(--brand-primary);">Meeting agenda</p>
      </div>
      <!-- Body -->
      <div style="flex: 1; padding: 20pt 14pt;">

        <!-- Item 1 - HIGHLIGHTED with left accent bar -->
        <div style="display: flex; width: 58%; align-items: stretch; gap: 0pt; margin-bottom: 16pt;">
          <div style="width: 6pt; min-width: 6pt; background: var(--brand-secondary);"></div>
          <div style="background: var(--brand-primary); padding: 14pt 18pt; flex: 1;">
            <p style="margin: 0; font-size: 12px; font-weight: bold; color: white; line-height: 1.4;">Motor, Pension and Health as key growth drivers in short-mid term in Poland</p>
          </div>
        </div>

        <!-- Item 2 - Non-highlighted -->
        <div style="background: var(--brand-gray-medium); padding: 14pt 18pt; width: 55%; margin-left: 12pt; margin-bottom: 16pt;">
          <p style="margin: 0; font-size: 12px; color: var(--brand-text); line-height: 1.4;">New global emerging trends are driving growth in the insurance industry</p>
        </div>

        <!-- Item 3 - Non-highlighted -->
        <div style="background: var(--brand-gray-medium); padding: 14pt 18pt; width: 55%; margin-left: 12pt; margin-bottom: 16pt;">
          <p style="margin: 0; font-size: 12px; color: var(--brand-text); line-height: 1.4;">Regulatory changes have fostered market growth in Turkey (case example)</p>
        </div>

        <!-- Item 4 - Non-highlighted -->
        <div style="background: var(--brand-gray-medium); padding: 14pt 18pt; width: 55%; margin-left: 12pt;">
          <p style="margin: 0; font-size: 12px; color: var(--brand-text); line-height: 1.4;">Discussion points</p>
        </div>

      </div>
    </div>

  </div>

  <div class="footer-zone">
    <p class="source">SOURCE: Team analysis</p>
    <p class="page-num">Nexus | 1</p>
  </div>
</body>
